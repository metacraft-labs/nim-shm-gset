\* TLC configuration: the keyed key discipline (multimap + tombstones + growth).
SPECIFICATION Spec

CONSTANTS
    ka = ka
    kb = kb
    i1 = i1
    i2 = i2
    p1 = p1
    p2 = p2
    Cap = 4
    MaxShards = 3
    MaxGen = 4
    Empty = Empty
    Keys <- KeysDef
    Ids <- IdsDef
    Producers <- ProducersDef
    Home <- HomeDef
    Work <- WorkDef
    FlattenEnabled = FALSE
    ReaderEnabled = FALSE

INVARIANTS
    TypeOK
    NoPhantom
    NoLostElement
    AnchorNeverRetired
    RunEnumerationExact
    RunIntegrityAcrossShards
    EnumerationDecidesLikeUnion
    GenerationInvariant
    EvictionEffective
    PutEffective
    FlattenDrainsOnlyCopied
    ReaderCompleteUnderFlatten
    CannotSaturate

PROPERTIES
    ObservabilityMonotone
    EventuallyStable
    Termination
