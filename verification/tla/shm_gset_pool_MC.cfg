\* TLC configuration for the host-side recycling POOL lifecycle (HM-3) — the
\* SHIPPED configuration: reset on acquire, exclusive leases, retire on a
\* permanent refusal.
SPECIFICATION Spec

\* The model terminates: every worker completes its rounds and stops. That is a
\* normal end state, not a deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    ca = ca
    cb = cb
    nochain = nochain
    NoChain = nochain
    Chains <- ChainsDef
    Workers <- WorkersDef
    Rounds = 2
    MaxGen = 3
    BusyBudget = 2
    ResetOnAcquire = TRUE
    ExclusiveIdle = TRUE
    RetireOnPermanent = TRUE

INVARIANTS
    TypeOK
    NoSharedChain
    NeverUnresetHandout
    LeaseGenStable
    RetiredIsNeverHeld
    ChainAccounting
    NoPermanentlyIdleChain
    BusyRetriesBounded

PROPERTIES
    EventuallyAllServed
