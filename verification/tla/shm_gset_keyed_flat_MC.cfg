\* TLC configuration: flatten + retire racing a concurrent oldest-first reader.
SPECIFICATION Spec

CONSTANTS
    ka = ka
    kb = kb
    i1 = i1
    i2 = i2
    p1 = p1
    Cap = 2
    MaxShards = 5
    MaxGen = 4
    Empty = Empty
    Keys <- KeysDef
    Ids <- IdsDef
    Producers <- ProducersDef
    Home <- HomeDef
    Work <- WorkDef
    FlattenEnabled = TRUE
    ReaderEnabled = TRUE

INVARIANTS
    TypeOK
    NoPhantom
    NoLostElement
    AnchorNeverRetired
    RunEnumerationExact
    RunIntegrityAcrossShards
    EnumerationDecidesLikeUnion
    GenerationInvariant
    EvictionEffective
    PutEffective
    FlattenDrainsOnlyCopied
    ReaderCompleteUnderFlatten
    CannotSaturate

PROPERTIES
    ObservabilityMonotone
    EventuallyStable
    Termination
