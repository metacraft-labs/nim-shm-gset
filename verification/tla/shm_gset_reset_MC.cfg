\* TLC configuration for the reset/recycling protocol model (design spec
\* §4.5(a)) — the SHIPPED configuration.
SPECIFICATION Spec

\* The model terminates: every producer finishes and the generation counter
\* reaches its bound. That is a normal end state, not a protocol deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    p1 = p1
    p2 = p2
    x = x
    y = y
    none = none
    NoElem = none
    Cap = 2
    MaxGen = 3
    Producers <- ProducersDef
    ElemOf <- ElemOfDef
    HomeOf <- HomeOfDef
    QuiescenceCheck = TRUE
    Sealed = TRUE
    RearmFirst = TRUE

INVARIANTS
    TypeOK
    NoCrossGenerationLeak
    NoLossAfterReset
    LivenessArmedUnderCurrentGen
    NoProducerAbandonedUnderCurrentGen
    StampsDominatedByGeneration

PROPERTIES
    EventuallyQuiet
